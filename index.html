<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Elektriker Pro - Schulung, Schaltsymbole, Schaltpläne & KI Modus</title>
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06b6d4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Elektriker Pro">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2983/2983780.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #04060b;
            --card-bg: rgba(13, 20, 35, 0.75);
            --card-border: rgba(6, 182, 212, 0.15);
            --card-border-hover: rgba(6, 182, 212, 0.4);
            --card-hover: rgba(255, 255, 255, 0.08);
            --primary: #06b6d4;
            --primary-glow: rgba(6, 182, 212, 0.35);
            --secondary: #8b5cf6;
            --secondary-glow: rgba(139, 92, 246, 0.3);
            --ai-color: #ec4899;
            --ai-glow: rgba(236, 72, 153, 0.35);
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --correct: #10b981;
            --correct-glow: rgba(16, 185, 129, 0.3);
            --incorrect: #ef4444;
            --incorrect-glow: rgba(239, 68, 68, 0.3);
            --radius-lg: 28px;
            --radius-md: 20px;
            --radius-sm: 14px;
            --font-code: 'JetBrains Mono', monospace;
            --transition-smooth: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(6, 182, 212, 0.15) 0px, transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(139, 92, 246, 0.15) 0px, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(10, 15, 30, 0.9) 0px, transparent 100%),
                linear-gradient(to bottom, #04060b, #070a12);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 32px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1080px;
            margin: 0 auto;
        }

        /* ... rest of the original CSS and HTML unchanged ... */
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div id="connection-status" class="status-badge"><div class="status-dot"></div> Online</div>
            <div class="brand-badge">⚡ Normenkonform & Adaptiv</div>
            <h1>Elektriker Pro</h1>
            <p>Schulungsportal, Schaltsymbole, Schaltpläne & KI Modus</p>
        </div>

        <!-- Dashboard Bar -->
        <div class="stats-bar">
            <div class="stat-card" onclick="toggleDetailedStats()" style="cursor: pointer;" title="Klicken für Detailansicht">
                <div class="stat-val" id="stat-score">0%</div>
                <div class="stat-lbl">Genauigkeit</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="stat-completed">0</div>
                <div class="stat-lbl">Gelöste Fragen</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="stat-level">Lvl 1</div>
                <div class="stat-lbl">Skill Level</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="stat-high">0</div>
                <div class="stat-lbl">Highscore</div>
            </div>
        </div>

        <!-- ... rest of the original HTML unchanged ... -->

    </div>

    <!-- non-destructive progress-fix script -->
    <script src="/fixes/progress-fix.js" defer></script>
</body>
</html>
