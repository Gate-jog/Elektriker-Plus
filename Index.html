<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Elektriker Plus - Schulung, Schaltsymbole, VS-Modus & Netze Österreich</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06b6d4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Elektriker Plus">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2983/2983780.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #04060b;
            --card-bg: rgba(13, 20, 35, 0.75);
            --card-border: rgba(6, 182, 212, 0.15);
            --card-border-hover: rgba(6, 182, 212, 0.4);
            --card-hover: rgba(255, 255, 255, 0.08);
            --primary: #06b6d4;
            --primary-glow: rgba(6, 182, 212, 0.35);
            --secondary: #8b5cf6;
            --secondary-glow: rgba(139, 92, 246, 0.3);
            --ai-color: #ec4899;
            --ai-glow: rgba(236, 72, 153, 0.35);
            --vs-color: #f43f5e;
            --vs-glow: rgba(244, 63, 94, 0.35);
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --correct: #10b981;
            --correct-glow: rgba(16, 185, 129, 0.3);
            --incorrect: #ef4444;
            --incorrect-glow: rgba(239, 68, 68, 0.3);
            --radius-lg: 28px;
            --radius-md: 20px;
            --radius-sm: 14px;
            --font-code: 'JetBrains Mono', monospace;
            --transition-smooth: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(6, 182, 212, 0.15) 0px, transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(139, 92, 246, 0.15) 0px, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(10, 15, 30, 0.9) 0px, transparent 100%),
                linear-gradient(to bottom, #04060b, #070a12);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 32px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1080px;
            margin: 0 auto;
        }

        .user-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(13, 20, 35, 0.85);
            border: 1px solid var(--card-border);
            padding: 12px 24px;
            border-radius: 50px;
            margin-bottom: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .user-profile-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            border: 2px solid var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
            cursor: pointer;
        }

        .user-details-text {
            display: flex;
            flex-direction: column;
        }

        .user-name-display {
            font-weight: 800;
            font-size: 0.95rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-id-badge {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: var(--primary);
            font-family: var(--font-code);
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 8px;
        }

        .user-actions {
            display: flex;
            gap: 10px;
        }

        .btn-top-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-top-action:hover {
            background: rgba(6, 182, 212, 0.15);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 6, 11, 0.92);
            backdrop-filter: blur(25px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 480px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 40px var(--primary-glow);
            text-align: center;
        }

        .auth-tabs {
            display: flex;
            background: rgba(0,0,0,0.5);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 28px;
            border: 1px solid var(--card-border);
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 10px;
            transition: var(--transition-smooth);
        }

        .auth-tab.active {
            background: var(--primary);
            color: #000;
            font-weight: 800;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }

        .auth-form label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .auth-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: var(--transition-smooth);
        }

        .auth-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .avatar-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 6px;
        }

        .avatar-opt {
            font-size: 1.6rem;
            padding: 8px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: var(--transition-smooth);
            background: rgba(255,255,255,0.05);
        }

        .avatar-opt.selected {
            border-color: var(--primary);
            background: rgba(6, 182, 212, 0.2);
            transform: scale(1.15);
        }

        .btn-auth-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--primary), #0284c7);
            color: #000;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: var(--transition-smooth);
            box-shadow: 0 8px 25px var(--primary-glow);
        }

        .btn-auth-submit:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .guest-divider {
            margin: 20px 0;
            display: flex;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .guest-divider::before, .guest-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--card-border);
        }

        .guest-divider span { padding: 0 10px; }

        .btn-guest {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-guest:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--secondary);
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
            position: relative;
        }

        .status-badge {
            position: absolute;
            top: 0; right: 0;
            font-size: 0.75rem;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: var(--correct);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
        }
        
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background-color: var(--correct);
            box-shadow: 0 0 10px var(--correct);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { opacity: 0.8; transform: scale(1.05); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.12), rgba(139, 92, 246, 0.12));
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: var(--primary);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 18px;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.2);
            backdrop-filter: blur(12px);
        }

        .header h1 {
            font-size: 3.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 15%, var(--primary) 65%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1.5px;
            text-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.15rem;
            font-weight: 500;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            margin-bottom: 28px;
            transition: var(--transition-smooth);
        }
        
        .glass-card:hover { border-color: var(--card-border-hover); }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 22px 16px;
            text-align: center;
            transition: var(--transition-smooth);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        
        .stat-card:hover { 
            transform: translateY(-4px); 
            border-color: var(--primary);
            background: rgba(6, 182, 212, 0.04);
            box-shadow: 0 12px 30px var(--primary-glow);
        }

        .stat-val {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            font-family: var(--font-code);
            text-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        .stat-lbl {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 6px;
            font-weight: 700;
        }

        .achievements-bar {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 36px;
            flex-wrap: wrap;
        }

        .badge-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            filter: grayscale(1);
            opacity: 0.4;
            transition: var(--transition-smooth);
            font-weight: 700;
            backdrop-filter: blur(10px);
        }

        .badge-item.unlocked {
            filter: grayscale(0);
            opacity: 1;
            border-color: var(--primary);
            color: var(--text-main);
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(139, 92, 246, 0.1));
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-2px);
        }

        .welcome-card { text-align: center; max-width: 960px; margin: 0 auto; }
        
        .menu-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 36px 0 20px;
        }

        .menu-option {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 28px 18px;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .menu-option::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .menu-option:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--primary);
            box-shadow: 0 25px 50px -10px var(--primary-glow);
        }

        .menu-option:hover::before { opacity: 1; }

        .menu-icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
            background: rgba(6, 182, 212, 0.08);
            width: 70px; height: 70px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.1);
            transition: var(--transition-smooth);
        }

        .menu-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
            text-align: center;
        }

        .menu-description {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.5;
            text-align: center;
        }

        .mode-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .nav-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.09);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .mode-toggle {
            display: flex;
            background: rgba(4, 6, 11, 0.7);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            gap: 6px;
            flex-wrap: wrap;
            backdrop-filter: blur(20px);
        }

        .toggle-btn {
            padding: 10px 18px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, var(--primary), #0284c7);
            color: #000;
            font-weight: 800;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .content-area { display: none; }
        .content-area.active { display: block; animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Modern Vector SVG Diagrams Container */
        .diagram-container {
            background: radial-gradient(ellipse at center, rgba(13, 20, 35, 0.95) 0%, rgba(4, 6, 11, 0.98) 100%);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 24px;
            margin: 24px 0;
            box-shadow: inset 0 2px 12px rgba(0,0,0,0.8), 0 8px 30px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .diagram-container svg {
            width: 100%;
            height: auto;
            max-height: 340px;
            display: block;
        }

        .diagram-legend {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 0.82rem;
            font-family: var(--font-code);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 14px;
            height: 4px;
            border-radius: 2px;
        }

        .search-bar {
            width: 100%;
            padding: 18px 26px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            color: #fff;
            font-size: 1.05rem;
            margin-bottom: 36px;
            outline: none;
            transition: var(--transition-smooth);
        }

        .search-bar:focus { 
            border-color: var(--primary); 
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), 0 0 20px var(--primary-glow);
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 22px;
        }

        .topic-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 28px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .topic-card:hover {
            border-color: var(--secondary);
            background: rgba(139, 92, 246, 0.06);
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.2);
        }

        .topic-icon-box { 
            font-size: 2.5rem; 
            margin-bottom: 18px; 
            background: rgba(139, 92, 246, 0.1);
            width: 65px; height: 65px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 16px;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .article-view h2 { font-size: 2.2rem; margin-bottom: 10px; }
        .article-view .article-desc { color: var(--primary); margin-bottom: 36px; font-size: 1.15rem; font-weight: 600; }

        .article-section {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 28px;
            margin-bottom: 28px;
        }

        .article-section h3 {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 18px;
            display: flex; align-items: center; gap: 12px;
            font-weight: 800;
        }

        .custom-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 24px 0;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        .custom-table th, .custom-table td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
        }

        .custom-table th { background: rgba(6, 182, 212, 0.1); color: var(--primary); font-weight: 800; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card">
            <div class="brand-badge" style="margin-bottom: 12px;">⚡ ELEKTRIKER PLUS</div>
            <h2 style="font-size: 1.8rem; margin-bottom: 6px;">Willkommen</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;">Melde dich an, um deinen Fortschritt zu speichern.</p>
            <button class="btn-guest" onclick="handleGuestLogin()">Als Gast fortfahren (Schnellstart)</button>
        </div>
    </div>

    <div id="main-app" class="container" style="display: none;">
        
        <div class="user-top-bar">
            <div class="user-profile-info">
                <div class="user-avatar" id="top-avatar-display">⚡</div>
                <div class="user-details-text">
                    <div class="user-name-display">
                        <span id="top-username-display">Elektro-Profi</span>
                        <span class="user-id-badge" id="top-user-id-display">EP-882190</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="header">

                    <p class="article-desc">Detailvergleich der Schutzmaßnahmen und Schaltungstypen im österreichischen Niederspannungsnetz.</p>

                    <div class="article-section">
                        <h3>1. TN-C-S System (Standard in AT Wohngebäuden)</h3>
                        <p>Im TN-C-S-System wird vom Transformator bis zum HAK (Hausanschlusskasten) ein kombinierter <strong>PEN-Leiter</strong> geführt (TN-C). Im Gebäudeverteiler erfolgt die klare Aufteilung in einen separaten <strong>Neutralleiter (N)</strong> und <strong>Schutzleiter (PE)</strong>.</p>

                        <div class="info-badge">

                        </div>
                    </div>

                    <div class="article-section">
                        <h3>2. TT-System (Verbraucher unabhängig geerdet)</h3>
                        <p>Im TT-System ist der Sternpunkt des Speisetrafos direkt geerdet. Die Schutzleiter der Verbraucheranlage sind jedoch <strong>nicht</strong> mit dem Betriebserder des Netzes verbunden, sondern an einen eigenen Anlagenerder ($R_A$) angeschlossen.</p>
                        ${NETZE_GRAPHICS['tt-system']}
                        <p><strong>Besonderheit:</strong> Aufgrund höherer Schleifenimpedanzen ist der Einsatz von <strong>RCDs (FI-Schutzschaltern)</strong> als Fehlerschutz im TT-Netz zwingend vorgeschrieben!</p>
                    </div>

                    <div class="article-section">

                        <p>Das <strong>IT-System (Isolierungs-Terre)</strong> hat keine direkte Verbindung zwischen aktiven Leitern und Erde. Der Sternpunkt ist entweder vollständig isoliert oder über eine hohe Impedanz ($Z_i$) geerdet.</p>

                                </tr>
                            </thead>

                                </tr>
                                <tr>
                                    <td><strong>Überwachung</strong></td>
                                    <td>Ein continuous <strong>IMD (Insulation Monitoring Device)</strong> meldet den 1. Fehler optisch/akustisch.</td>
                                </tr>
                                <tr>

                                    <td>OP-Räume (ÖVE EH 8007), Intensivstationen, Chemiewerke, Bergwerke.</td>
                                </tr>
                            </tbody>

        function initTopics() {
            const container = document.getElementById('topics-container');

                <div class="topic-card" onclick="openTopic('${t.id}')">
                    <div class="topic-icon-box">${t.icon}</div>
                    <h3>${t.title}</h3>
                    <p>${t.desc}</p>
                </div>
            `).join('');
        }

        function openTopic(id) {
            const topic = TOPICS_DATA.find(t => t.id === id);
            if (!topic) return;
            document.getElementById('topics-view').style.display = 'none';
            document.getElementById('content-container').innerHTML = topic.content;
            document.getElementById('content-view').style.display = 'block';
        }

        function backToTopics() {
            document.getElementById('content-view').style.display = 'none';
            document.getElementById('topics-view').style.display = 'block';
        }

        function filterTopics() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const cards = document.querySelectorAll('.topic-card');
            cards.forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(q) ? 'block' : 'none';
            });
        }

        function switchMode(mode) {
            document.querySelectorAll('.content-area').forEach(a => a.classList.remove('active'));
            document.getElementById(mode + '-mode').classList.add('active');
        }
